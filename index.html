<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание</title>
    <!-- Подключение Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f0f2f5;
            padding: 16px;
            max-width: 540px;
            margin: 0 auto;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        body.dark {
            background: #1a1a2e;
            color: #e0e0e0;
        }
        body.dark .pair-card {
            background: #2d2d44;
            color: #e0e0e0;
        }
        body.dark .pair-card .subject {
            color: #ffffff;
        }
        body.dark .pair-card .teacher {
            color: #b0b0c0;
        }
        body.dark .day-title {
            border-bottom-color: #3d3d5a;
        }
        body.dark .day-title h2 {
            color: #ffffff;
        }
        body.dark .day-nav button {
            background: #2d2d44;
            color: #b0b0c0;
        }
        body.dark .day-nav button.active {
            background: #6c5ce7;
            color: white;
        }
        body.dark .week-switch button {
            background: #2d2d44;
            color: #b0b0c0;
            border-color: #3d3d5a;
        }
        body.dark .week-switch button.active {
            border-color: #6c5ce7;
            background: #3d3d5a;
            color: #6c5ce7;
        }
        body.dark .week-switch button.real-week {
            border-color: #00b894 !important;
            color: #ffffff !important;
        }
        body.dark .week-switch button.real-week.active {
            border-color: #00b894 !important;
            background: #00b894 !important;
            color: white !important;
        }
        body.dark .week-switch button.selected-week {
            border-color: #6c5ce7 !important;
            color: #b0a0e0 !important;
        }
        body.dark .week-switch button.selected-week.active {
            border-color: #6c5ce7 !important;
            background: #6c5ce7 !important;
            color: white !important;
        }
        body.dark .header .group {
            color: #ffffff;
        }
        body.dark .pair-card.current {
            background: #1a3d2a;
        }
        body.dark .pair-card.next {
            background: #3d3a1a;
        }
        body.dark .empty-day {
            color: #8888aa;
        }
        body.dark .timer-container {
            background: #2d2d44;
        }
        body.dark .day-nav-arrow {
            background: #2d2d44;
            color: #e0e0e0;
        }
        body.dark .day-nav button.today-btn {
            border-color: #00b894;
        }
        body.dark .subgroup-badge {
            background: #3d3a5a;
            color: #b0a0e0;
        }
        body.dark .note-input {
            background: #3d3d5a;
            color: #e0e0e0;
            border-color: #4d4d6a;
        }
        body.dark .note-input::placeholder {
            color: #8888aa;
        }
        body.dark .action-button {
            background: #6c5ce7;
            color: white;
            border-color: #6c5ce7;
        }
        body.dark .action-button:hover {
            background: #5a4bd1;
        }
        body.dark .modal-window {
            background: #2d2d44;
            color: #e0e0e0;
        }
        body.dark .modal-body table th {
            background: #3d3d5a;
            color: #e0e0e0;
        }
        body.dark .modal-body table td {
            border-bottom-color: #3d3d5a;
            color: #e0e0e0;
        }
        body.dark .modal-close {
            color: #b0b0c0;
        }
        body.dark .modal-close:hover {
            background: rgba(255,255,255,0.05);
        }
        body.dark .subgroup-tag {
            background: #3d3a5a;
            color: #b0a0e0;
        }
        body.dark .exam-status {
            background: #3d3d5a;
            color: #b0b0c0;
        }
        body.dark .exam-status.pass {
            background: #1a3d3a;
            color: #6cce7a;
        }
        body.dark .exam-status.fail {
            background: #3d2a2a;
            color: #e17055;
        }
        body.dark .watermark {
            color: rgba(255, 255, 255, 0.15);
        }
        body.dark .watermark .watermark-nick {
            color: rgba(255, 255, 255, 0.25);
        }
        body.dark .modal-body .teacher-name {
            color: #e0e0e0;
        }
        body.dark .leaflet-control-attribution {
            color: #b0b0c0 !important;
        }
        body.dark .leaflet-tile {
            filter: brightness(0.7) saturate(0.8);
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 4px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header .group {
            font-weight: 700;
            font-size: 1.1rem;
            color: #1a1a2e;
        }
        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .header-search {
            display: flex;
            gap: 6px;
            align-items: center;
            flex: 1;
            max-width: 280px;
            min-width: 120px;
        }
        .search-input {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid #dfe6e9;
            border-radius: 20px;
            font-size: 0.8rem;
            outline: none;
            background: white;
            transition: 0.2s;
            min-width: 60px;
        }
        .search-input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 2px rgba(108, 92, 231, 0.1);
        }
        .search-button {
            padding: 6px 14px;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .search-button:hover {
            background: #5a4bd1;
        }
        .search-button:active {
            transform: scale(0.95);
        }
        .search-clear {
            background: none;
            border: none;
            color: #b2bec3;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 4px;
            display: none;
        }
        .search-clear.show {
            display: inline;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            background: rgba(108, 92, 231, 0.1);
            transition: 0.3s;
        }
        .theme-toggle:hover {
            background: rgba(108, 92, 231, 0.2);
        }

        /* ===== ТАЙМЕР ===== */
        .timer-container {
            background: #f8f4e8;
            border-radius: 16px;
            padding: 14px 18px;
            margin: 12px 0 16px;
            color: #2d3436;
            transition: background 0.3s, color 0.3s;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        body.dark .timer-container {
            background: #2d2d44;
            color: #e0e0e0;
        }
        .timer-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .timer-container .timer-label {
            font-size: 1rem;
            font-weight: 600;
            opacity: 0.9;
            flex: 1;
        }
        .timer-container .timer-display {
            font-size: 1.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            min-width: 120px;
            text-align: right;
            letter-spacing: 2px;
        }
        .timer-container .timer-display.ongoing {
            color: #00b894;
        }
        .timer-container .timer-display.waiting {
            color: #fdcb6e;
        }
        .timer-container .timer-display.done {
            color: #b2bec3;
        }
        .timer-container .timer-display.weekend {
            color: #6c5ce7;
        }
        .timer-sub-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #e9ecef;
            font-size: 0.9rem;
        }
        body.dark .timer-sub-row {
            border-top-color: #3d3d5a;
        }
        .timer-sub-row .timer-sub-label {
            font-weight: 500;
            opacity: 0.9;
        }
        .timer-sub-row .timer-sub-display {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
            font-size: 1.2rem;
        }
        .timer-sub-row .timer-sub-display.ongoing {
            color: #00b894;
        }
        .timer-sub-row .timer-sub-display.waiting {
            color: #fdcb6e;
        }
        .timer-sub-row .timer-sub-display.done {
            color: #b2bec3;
        }

        /* ===== ПЕРЕКЛЮЧЕНИЕ НЕДЕЛЬ ===== */
        .week-switch {
            display: flex;
            gap: 8px;
            margin: 16px 0 12px;
        }
        .week-switch button {
            flex: 1;
            padding: 10px;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            background: white;
            font-weight: 700;
            font-size: 0.85rem;
            color: #636e72;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .week-switch button.active {
            border-color: #6c5ce7;
            background: #f8f7ff;
            color: #6c5ce7;
        }
        .week-switch button.real-week {
            border-color: #00b894 !important;
            color: #2d3436 !important;
        }
        .week-switch button.real-week.active {
            border-color: #00b894 !important;
            background: #00b894 !important;
            color: white !important;
        }
        .week-switch button.selected-week {
            border-color: #6c5ce7 !important;
            color: #6c5ce7 !important;
        }
        body.dark .week-switch button.selected-week {
            border-color: #6c5ce7 !important;
            color: #b0a0e0 !important;
        }
        .week-switch button.selected-week.active {
            border-color: #6c5ce7 !important;
            background: #6c5ce7 !important;
            color: white !important;
        }
        body.dark .week-switch button.selected-week.active {
            border-color: #6c5ce7 !important;
            background: #6c5ce7 !important;
            color: white !important;
        }
        .week-switch button:active { transform: scale(0.97); }

        /* ===== НАВИГАЦИЯ ПО ДНЯМ ===== */
        .day-nav {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding: 2px 0;
            -webkit-overflow-scrolling: touch;
            justify-content: center;
            min-height: 50px;
        }
        .day-nav button {
            flex: 1;
            min-width: 44px;
            padding: 8px 0;
            border: none;
            border-radius: 12px;
            background: white;
            font-weight: 600;
            font-size: 0.75rem;
            color: #636e72;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .day-nav button .day-num {
            font-size: 0.55rem;
            opacity: 0.5;
            font-weight: 400;
        }
        .day-nav button.active {
            background: #6c5ce7;
            color: white;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }
        .day-nav button.today-btn {
            border: 2px solid #00b894;
        }
        body.dark .day-nav button.today-btn {
            border-color: #00b894;
        }

        /* ===== СТРЕЛКИ ПОД РАСПИСАНИЕМ ===== */
        .day-nav-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0 16px;
            justify-content: center;
        }
        .day-nav-arrow {
            background: white;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #2d3436;
        }
        body.dark .day-nav-arrow {
            background: #2d2d44;
            color: #e0e0e0;
        }
        .day-nav-arrow:active {
            transform: scale(0.95);
        }
        .day-nav-arrow .arrow-label {
            font-size: 0.7rem;
            opacity: 0.6;
        }
        .day-nav-center {
            font-weight: 600;
            font-size: 0.9rem;
            color: #2d3436;
            min-width: 80px;
            text-align: center;
        }
        body.dark .day-nav-center {
            color: #e0e0e0;
        }

        /* ===== ЗАГОЛОВОК ДНЯ ===== */
        .day-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 4px 12px 4px;
            border-bottom: 2px solid #e9ecef;
            margin-bottom: 16px;
        }
        .day-title h2 {
            font-size: 1.4rem;
            color: #1a1a2e;
        }
        .day-title .pair-count {
            font-size: 0.8rem;
            color: #b2bec3;
            font-weight: 500;
        }

        /* ===== КАРТОЧКА ПАРЫ ===== */
        .pair-card {
            background: white;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 4px solid #dfe6e9;
            transition: 0.3s;
        }
        .pair-card.current {
            border-left-color: #00b894 !important;
            background: #f0faf8;
        }
        .pair-card.next {
            border-left-color: #fdcb6e !important;
            background: #fffdf0;
        }
        .pair-card.hidden {
            display: none;
        }
        .pair-card .time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .pair-card .time {
            font-weight: 700;
            font-size: 0.9rem;
            color: #2d3436;
        }
        body.dark .pair-card .time {
            color: #e0e0e0;
        }
        .pair-card .type-badge {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 30px;
            background: #dfe6e9;
            color: #2d3436;
            letter-spacing: 0.3px;
        }
        .type-badge.practice { background: #a29bfe; color: white; }
        .type-badge.lecture { background: #dfe6e9; color: #2d3436; }
        .type-badge.lab { background: #fd79a8; color: white; }
        body.dark .type-badge.lecture {
            background: #3d3d5a;
            color: #e0e0e0;
        }

        .pair-card .subject {
            font-weight: 700;
            font-size: 1.1rem;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        
        /* ===== ПРЕПОДАВАТЕЛЬ (кликабельный) ===== */
        .teacher-name {
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 1px dashed transparent;
        }
        .teacher-name:hover {
            border-bottom-color: #6c5ce7;
            color: #6c5ce7;
        }
        body.dark .teacher-name:hover {
            border-bottom-color: #b0a0e0;
            color: #b0a0e0;
        }

        /* ===== ПОДГРУППА ===== */
        .subgroup-badge {
            font-size: 0.7rem;
            font-weight: 600;
            color: #6c5ce7;
            background: #f0edff;
            padding: 2px 12px;
            border-radius: 30px;
            display: inline-block;
            margin: 4px 0 6px;
        }

        .pair-card .teacher {
            font-size: 0.8rem;
            color: #636e72;
        }
        .pair-card .room {
            font-size: 0.8rem;
            color: #00b894;
            font-weight: 600;
            background: #e8f8f5;
            padding: 2px 12px;
            border-radius: 30px;
            display: inline-block;
        }
        body.dark .pair-card .room {
            background: #1a3d3a;
            color: #6cce7a;
        }
        .pair-card .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* ===== РАЗДЕЛЕНИЕ НА ПОДГРУППЫ ===== */
        .subgroup-wrapper {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed #e9ecef;
            align-items: stretch;
        }
        body.dark .subgroup-wrapper {
            border-top-color: #3d3d5a;
        }
        .subgroup-col {
            flex: 1;
            min-width: 0;
            display: flex;
        }
        .subgroup-col-inner {
            flex: 1;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            border: 1px solid #e9ecef;
            min-height: 80px;
        }
        body.dark .subgroup-col-inner {
            background: #2d2d44;
            border-color: #3d3d5a;
        }
        .subgroup-col-inner .subgroup-label {
            font-size: 0.6rem;
            font-weight: 700;
            color: #6c5ce7;
            background: #f0edff;
            padding: 1px 10px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 6px;
            align-self: flex-start;
        }
        body.dark .subgroup-col-inner .subgroup-label {
            background: #3d3a5a;
            color: #b0a0e0;
        }
        .subgroup-col-inner .subgroup-empty {
            font-size: 0.7rem;
            color: #b2bec3;
            font-style: italic;
            padding: 4px 0;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .subgroup-col-inner .subgroup-subject {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a1a2e;
            margin-bottom: 2px;
        }
        body.dark .subgroup-col-inner .subgroup-subject {
            color: #e0e0e0;
        }
        .subgroup-col-inner .subgroup-teacher {
            font-size: 0.75rem;
            color: #636e72;
            margin-bottom: 2px;
        }
        body.dark .subgroup-col-inner .subgroup-teacher {
            color: #b0b0c0;
        }
        .subgroup-col-inner .subgroup-room {
            font-size: 0.75rem;
            color: #00b894;
            font-weight: 600;
            background: #e8f8f5;
            padding: 1px 10px;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-bottom: 6px;
        }
        body.dark .subgroup-col-inner .subgroup-room {
            background: #1a3d3a;
            color: #6cce7a;
        }
        .subgroup-col-inner .subgroup-note {
            margin-top: auto;
            padding-top: 6px;
        }
        .subgroup-col-inner .subgroup-note textarea {
            width: 100%;
            padding: 4px 8px;
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            font-size: 0.7rem;
            line-height: 1.4;
            color: #2d3436;
            background: white;
            outline: none;
            resize: vertical;
            min-height: 32px;
            max-height: 100px;
            font-family: inherit;
            transition: 0.2s;
        }
        body.dark .subgroup-col-inner .subgroup-note textarea {
            background: #3d3d5a;
            color: #e0e0e0;
            border-color: #4d4d6a;
        }
        .subgroup-col-inner .subgroup-note textarea:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 2px rgba(108, 92, 231, 0.1);
        }
        .subgroup-col-inner .subgroup-note textarea::placeholder {
            color: #b2bec3;
            font-style: italic;
        }
        .subgroup-col-inner .note-saved {
            font-size: 0.6rem;
            color: #00b894;
            margin-top: 2px;
            opacity: 0;
            transition: opacity 0.3s;
            text-align: right;
        }
        .subgroup-col-inner .note-saved.show {
            opacity: 1;
        }

        /* ===== ЗАМЕТКИ (для обычных пар) ===== */
        .note-area {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #e9ecef;
        }
        body.dark .note-area {
            border-top-color: #3d3d5a;
        }
        .note-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            font-size: 0.75rem;
            line-height: 1.5;
            color: #2d3436;
            background: #f8f9fa;
            transition: 0.2s;
            outline: none;
            resize: vertical;
            min-height: 40px;
            max-height: 120px;
            font-family: inherit;
        }
        .note-input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 2px rgba(108, 92, 231, 0.1);
        }
        .note-input::placeholder {
            color: #b2bec3;
            font-style: italic;
        }
        .note-saved {
            display: block;
            font-size: 0.6rem;
            color: #00b894;
            margin-top: 2px;
            opacity: 0;
            transition: opacity 0.3s;
            text-align: right;
        }
        .note-saved.show {
            opacity: 1;
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ===== */
        .empty-day {
            text-align: center;
            padding: 50px 20px;
            color: #b2bec3;
        }
        .empty-day .big-emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }
        .empty-day.weekend {

        // ================================================================
        // 7. ТАЙМЕР
        // ================================================================
        function updateTimerAndHighlight() {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const todayIndex = now.getDay();

            const timerDisplay = document.getElementById('timerDisplay');
            const timerLabel = document.getElementById('timerLabel');
            const timerSubRow = document.getElementById('timerSubRow');
            const timerSubLabel = document.getElementById('timerSubLabel');
            const timerSubDisplay = document.getElementById('timerSubDisplay');

            if (todayIndex === 0) {
                timerDisplay.textContent = '😴';
                timerDisplay.className = 'timer-display weekend';
                timerLabel.textContent = 'Сегодня выходной';
                timerSubRow.style.display = 'none';
                document.querySelectorAll('.pair-card.current, .pair-card.next').forEach(el => {
                    el.classList.remove('current', 'next');
                });
                return;
            }

            const weekData = schedule[realWeek];
            if (!weekData) {
                timerDisplay.textContent = '--:--:--';
                timerDisplay.className = 'timer-display done';
                timerLabel.textContent = '⚠️ Ошибка';
                timerSubRow.style.display = 'none';
                return;
            }

            const dayName = dayNames[todayIndex];
            const pairs = weekData[dayName] || [];

            const groupedByTime = {};
            pairs.forEach(pair => {
                if (!groupedByTime[pair.time]) {
                    groupedByTime[pair.time] = [];
                }
                groupedByTime[pair.time].push(pair);
            });

            const timeKeys = Object.keys(groupedByTime).sort();

            if (timeKeys.length === 0) {
                timerDisplay.textContent = '😌';
                timerDisplay.className = 'timer-display done';
                timerLabel.textContent = 'Пар нет';
                timerSubRow.style.display = 'none';
                document.querySelectorAll('.pair-card.current, .pair-card.next').forEach(el => {
                    el.classList.remove('current', 'next');
                });
                return;
            }

            let currentSlot = null;
            let nextSlot = null;
            let currentTime = null;
            let nextTime = null;

            for (const time of timeKeys) {
                const [start, end] = time.split(' – ');
                const [startH, startM] = start.split(':').map(Number);
                const [endH, endM] = end.split(':').map(Number);
                const startTotal = startH * 60 + startM;
                const endTotal = endH * 60 + endM;

                if (currentMinutes >= startTotal && currentMinutes < endTotal) {
                    currentSlot = groupedByTime[time];
                    currentTime = time;
                    break;
                }
                if (currentMinutes < startTotal && !nextSlot) {
                    nextSlot = groupedByTime[time];
                    nextTime = time;
                }
            }

            if (currentSlot && !nextSlot) {
                const currentIndex = timeKeys.indexOf(currentTime);
                if (currentIndex < timeKeys.length - 1) {
                    nextSlot = groupedByTime[timeKeys[currentIndex + 1]];
                    nextTime = timeKeys[currentIndex + 1];
                }
            }

            document.querySelectorAll('.pair-card.current, .pair-card.next').forEach(el => {
                el.classList.remove('current', 'next');
            });

            const isTodayView = (currentDayIndex === realDayIndex && currentWeek === realWeek);
            const nowSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

            function formatTime(seconds) {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                return { hours: h, mins: m, secs: s };
            }

            if (currentSlot) {
                const [start, end] = currentTime.split(' – ');
                const [endH, endM] = end.split(':').map(Number);
                const endSeconds = endH * 3600 + endM * 60;
                const remain = endSeconds - nowSeconds;
                const t = formatTime(remain);

                timerDisplay.textContent = `${String(t.hours).padStart(2, '0')}:${String(t.mins).padStart(2, '0')}:${String(t.secs).padStart(2, '0')}`;
                timerDisplay.className = 'timer-display ongoing';
                timerLabel.textContent = `До конца пары:`;

                if (isTodayView) {
                    highlightPairsByTime(currentTime, 'current');
                }

                if (nextSlot) {
                    const [nextStart] = nextTime.split(' – ');
                    const [nextH, nextM] = nextStart.split(':').map(Number);
                    const nextStartSeconds = nextH * 3600 + nextM * 60;
                    const wait = nextStartSeconds - nowSeconds;

                    if (wait > 0 && wait <= 43200) {
                        const wt = formatTime(wait);
                        timerSubRow.style.display = 'flex';
                        timerSubLabel.textContent = 'До начала следующей пары:';
                        timerSubDisplay.textContent = `${String(wt.hours).padStart(2, '0')}:${String(wt.mins).padStart(2, '0')}:${String(wt.secs).padStart(2, '0')}`;
                        timerSubDisplay.className = 'timer-sub-display waiting';
                    } else if (wait > 43200) {
                        timerSubRow.style.display = 'none';
                    } else {
                        timerSubRow.style.display = 'none';
                    }
                } else {
                    timerSubRow.style.display = 'none';
                }
                return;
            }

            if (nextSlot) {
                const [nextStart] = nextTime.split(' – ');
                const [nextH, nextM] = nextStart.split(':').map(Number);
                const nextStartSeconds = nextH * 3600 + nextM * 60;
                const wait = nextStartSeconds - nowSeconds;

                if (wait > 0 && wait <= 43200) {
                    const wt = formatTime(wait);
                    timerDisplay.textContent = `${String(wt.hours).padStart(2, '0')}:${String(wt.mins).padStart(2, '0')}:${String(wt.secs).padStart(2, '0')}`;
                    timerDisplay.className = 'timer-display waiting';
                    timerLabel.textContent = 'До начала следующей пары:';
                    timerSubRow.style.display = 'none';

                    if (isTodayView) {
                        highlightPairsByTime(nextTime, 'next');
                    }
                } else if (wait > 43200) {
                    timerDisplay.textContent = '⏳';
                    timerDisplay.className = 'timer-display done';
                    timerLabel.textContent = 'Следующая пара позже 12 часов';
                    timerSubRow.style.display = 'none';
                } else {
                    timerDisplay.textContent = '✅';
                    timerDisplay.className = 'timer-display done';
                    timerLabel.textContent = 'Скоро начнётся';
                    timerSubRow.style.display = 'none';
                }
                return;
            }

            timerDisplay.textContent = '✅';
            timerDisplay.className = 'timer-display done';
            timerLabel.textContent = 'Все пары закончились';
            timerSubRow.style.display = 'none';
        }

        function getUniqueTimeSlots() {
            const weekData = schedule[currentWeek];
            if (!weekData) return [];
            const dayName = dayNames[currentDayIndex];
            const pairs = weekData[dayName] || [];
            const uniqueTimes = new Set();
            pairs.forEach(p => uniqueTimes.add(p.time));
            return Array.from(uniqueTimes);
        }

        function render() {
            const weekData = schedule[currentWeek];
            if (!weekData) return;

            const dayName = dayNames[currentDayIndex];
            const pairs = weekData[dayName] || [];

            const isSunday = (currentDayIndex === 0);
            const isEmpty = pairs.length === 0;

            document.querySelectorAll('.week-switch button').forEach(b => {
                b.classList.remove('real-week', 'selected-week');
                const weekNum = parseInt(b.dataset.week);
                if (weekNum === realWeek) {
                    b.classList.add('real-week');
                }
                if (weekNum === currentWeek) {
                    b.classList.add('selected-week');
                }
            });

            const nav = document.getElementById('dayNav');
            nav.innerHTML = '';
            for (let i = 1; i <= 6; i++) {
                const btn = document.createElement('button');
                const isActive = i === currentDayIndex;
                const isToday = i === realDayIndex;
                btn.innerHTML = `${shortDayNames[i]} <span class="day-num">${isActive ? '●' : ''}</span>`;
                if (isActive) btn.classList.add('active');
                if (isToday) btn.classList.add('today-btn');
                btn.onclick = () => { currentDayIndex = i; render(); updateTimerAndHighlight(); };
                nav.appendChild(btn);
            }

            const centerEl = document.getElementById('dayNavCenter');
            if (currentDayIndex === realDayIndex && currentWeek === realWeek) {
                centerEl.textContent = 'Сегодня';
            } else {
                centerEl.textContent = dayNames[currentDayIndex];
            }

            document.getElementById('dayTitle').textContent = dayName;

            const container = document.getElementById('pairsContainer');
            container.innerHTML = '';

            if (isSunday) {
                document.getElementById('pairCount').textContent = 'Выходной';
                container.innerHTML = `
                    <div class="empty-day weekend">
                        <span class="big-emoji">😴</span>
                        <div class="weekend-title">Выходной</div>
                        <p style="font-size:0.9rem; opacity:0.7;">Сегодня можно отдохнуть</p>
                    </div>
                `;

                    el.classList.remove('current', 'next');

            if (isEmpty) {

                        <span class="big-emoji">😌</span>
                        Пар нет

            });

                    const pair1 = pairsAtTime.find(p => p.subgroup === '1-я подгруппа') || null;
                    const pair2 = pairsAtTime.find(p => p.subgroup === '2-я подгруппа') || null;
                    const commonPairs = pairsAtTime.filter(p => !p.subgroup);
                    
                    commonPairs.forEach(commonPair => {
                        const card = createPairCard(commonPair, dayName);
                        container.appendChild(card);
                    });
                    
                    if (pair1 || pair2) {
                        const card = document.createElement('div');
                        card.className = 'pair-card';
                        
                        const timeStr = pair1 ? pair1.time : (pair2 ? pair2.time : '');
                        const typeStr = pair1 ? pair1.type : (pair2 ? pair2.type : '');
                        const typeClass = getTypeClass(typeStr);
                        
                        card.innerHTML = `
                            <div class="time-row">
                                <span class="time">${timeStr}</span>
                                <span class="type-badge ${typeClass}">${typeStr}</span>
                            </div>
                            <div class="subgroup-wrapper">
                                <div class="subgroup-col">
                                    <div class="subgroup-col-inner">
                                        <div class="subgroup-label">👥 1-я подгруппа</div>
                                        ${pair1 ? `
                                            <div class="subgroup-subject">${pair1.name}</div>
                                            <div class="subgroup-teacher">${renderTeacherNames(pair1.teacher)}</div>
                                            <div class="subgroup-room">${pair1.room}</div>
                                            <div class="subgroup-note">
                                                <textarea class="note-input" 
                                                          id="note_input_${getPairId(pair1, dayName, currentWeek)}"
                                                          placeholder="Ваша заметка..."
                                                          onchange="saveNote('${getPairId(pair1, dayName, currentWeek)}', this.value)"
                                                >${loadNote(getPairId(pair1, dayName, currentWeek))}</textarea>
                                                <span class="note-saved" id="note_saved_${getPairId(pair1, dayName, currentWeek)}">✅ Сохранено</span>
                                            </div>
                                        ` : `
                                            <div class="subgroup-empty">— нет пары</div>
                                        `}
                                    </div>
                                </div>
                                <div class="subgroup-col">
                                    <div class="subgroup-col-inner">
                                        <div class="subgroup-label">👥 2-я подгруппа</div>
                                        ${pair2 ? `
                                            <div class="subgroup-subject">${pair2.name}</div>
                                            <div class="subgroup-teacher">${renderTeacherNames(pair2.teacher)}</div>
                                            <div class="subgroup-room">${pair2.room}</div>
                                            <div class="subgroup-note">
                                                <textarea class="note-input" 
                                                          id="note_input_${getPairId(pair2, dayName, currentWeek)}"
                                                          placeholder="Ваша заметка..."
                                                          onchange="saveNote('${getPairId(pair2, dayName, currentWeek)}', this.value)"
                                                >${loadNote(getPairId(pair2, dayName, currentWeek))}</textarea>
                                                <span class="note-saved" id="note_saved_${getPairId(pair2, dayName, currentWeek)}">✅ Сохранено</span>
                                            </div>
                                        ` : `
                                            <div class="subgroup-empty">— нет пары</div>
                                        `}
                                    </div>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    }
                } else {
                    pairsAtTime.forEach(pair => {
                        const card = createPairCard(pair, dayName);
                        container.appendChild(card);
                    });
                }
            });
            
            if (searchQuery !== '') {
                searchSchedule(searchQuery);
            }
            
            setTimeout(updateTimerAndHighlight, 50);
        }

        function getTypeClass(type) {
            if (type.includes('Практик')) return 'practice';
            if (type.includes('Лаб')) return 'lab';
            return 'lecture';
        }

        // ================================================================
        // 12. ОТРИСОВКА ПРЕПОДАВАТЕЛЕЙ (кликабельные, по одному)
        // ================================================================
        function renderTeacherNames(teacherStr) {
            if (!teacherStr || teacherStr === '?') return teacherStr || '?';
            
            const names = teacherStr.split(',').map(s => s.trim()).filter(s => s.length > 0);
            
            if (names.length === 0) return teacherStr;
            
            if (names.length === 1) {
                const short = names[0];
                const full = expandTeacherName(short);
                return `<span class="teacher-name" data-short="${short.replace(/'/g, "\\'")}" data-full="${full.replace(/'/g, "\\'")}" onclick="toggleTeacherName(this)">${short}</span>`;
            }
            
            return names.map(name => {
                const short = name.trim();
                const full = expandTeacherName(short);
                return `<span class="teacher-name" data-short="${short.replace(/'/g, "\\'")}" data-full="${full.replace(/'/g, "\\'")}" onclick="toggleTeacherName(this)">${short}</span>`;
            }).join(', ');
        }

        function createPairCard(pair, dayName) {
            const card = document.createElement('div');
            card.className = 'pair-card';

            const typeClass = getTypeClass(pair.type);
            const pairId = getPairId(pair, dayName, currentWeek);
            const savedNote = loadNote(pairId);

            card.innerHTML = `
                <div class="time-row">
                    <span class="time">${pair.time}</span>
                    <span class="type-badge ${typeClass}">${pair.type}</span>
                </div>
                <div class="subject">${pair.name}</div>
                ${pair.subgroup ? `<div class="subgroup-badge">👥 ${pair.subgroup}</div>` : ''}
                <div class="footer-row">
                    <span class="teacher">${renderTeacherNames(pair.teacher)}</span>
                    <span class="room">${pair.room}</span>
                </div>
                <div class="note-area">
                    <textarea class="note-input" 
                              id="note_input_${pairId}"
                              placeholder="Ваша заметка..."
                              onchange="saveNote('${pairId}', this.value)"
                    >${savedNote}</textarea>
                    <span class="note-saved" id="note_saved_${pairId}">✅ Сохранено</span>
                </div>
            `;
            return card;
        }

        // ================================================================
        // 13. ПЕРЕКЛЮЧЕНИЕ ИМЕНИ ПРЕПОДАВАТЕЛЯ
        // ================================================================
        function toggleTeacherName(element) {
            const short = element.dataset.short;
            const full = element.dataset.full;
            const current = element.textContent.trim();
            if (current === short) {
                element.textContent = full;
            } else {
                element.textContent = short;
            }
        }

        // ================================================================
        // 14. ПАСХАЛКА: ТРОЙНОЙ КЛИК ПО ВОДЯНОМУ ЗНАКУ
        // ================================================================
        let watermarkClickCount = 0;
        let watermarkTimer = null;

        document.getElementById('watermark').addEventListener('click', function(e) {
            watermarkClickCount++;
            
            clearTimeout(watermarkTimer);
            watermarkTimer = setTimeout(() => {
                watermarkClickCount = 0;
            }, 500);
            
            if (watermarkClickCount === 3) {
                watermarkClickCount = 0;
                playEasterEggSound();
            }
        });

        function playEasterEggSound() {
            const audio = document.getElementById('easterEggSound');
            if (!audio) return;
            
            audio.currentTime = 0;
            audio.volume = 1.0;
            audio.loop = false;
            audio.play().catch(e => {
                console.log('⚠️ Звук не воспроизведён:', e);
            });
        }

        // ================================================================
        // 15. ПЕРЕКЛЮЧЕНИЕ ДНЕЙ И НЕДЕЛЬ
        // ================================================================
        function changeDay(delta) {
            currentDayIndex += delta;
            if (currentDayIndex < 1) currentDayIndex = 6;
            if (currentDayIndex > 6) currentDayIndex = 1;
            render();
        }

        function setWeek(week) {
            currentWeek = week;
            document.querySelectorAll('.week-switch button').forEach(b => b.classList.remove('active'));
            document.querySelector(`.week-switch button[data-week="${week}"]`).classList.add('active');
            render();
        }

        // ================================================================
        // 16. КАРТА (fitBounds с обновлённой границей)
        // ================================================================
        let mapInitialized = false;

        function initMap() {
            if (mapInitialized) return;
            
            // Границы территории (юго-запад и северо-восток)
            const southWest = L.latLng(53.918071, 27.588059);
            const northEast = L.latLng(53.926573, 27.597969);
            
            const map = L.map('campusMap', {
                zoomControl: true,
                attributionControl: false
            });
            
            // Подстраиваем карту под область
            map.fitBounds([southWest, northEast], {
                padding: [30, 30],
                maxZoom: 18,
                animate: true
            });
            map.setMaxBounds([southWest, northEast]);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: ''
            }).addTo(map);
            
            // ===== МАРКЕРЫ КОРПУСОВ =====
            const buildings = [
                { name: 'АТФ (корпус 8)', lat: 53.920567, lng: 27.588658, num: 8, color: '#e17055' },
                { name: 'ФТУГ (корпус 9)', lat: 53.921606, lng: 27.589946, num: 9, color: '#fdcb6e' },
                { name: 'ПСФ (корпус 17)', lat: 53.923460, lng: 27.592001, num: 17, color: '#6c5ce7' },
                { name: 'МТФ (корпус 7)', lat: 53.923968, lng: 27.592933, num: 7, color: '#00b894' },
                { name: 'ВТФ (корпус 4)', lat: 53.919102, lng: 27.589793, num: 4, color: '#0984e3' },
                { name: 'Главный корпус (1)', lat: 53.920914, lng: 27.592777, num: 1, color: '#e17055' },
                { name: 'ФЭС (корпус 18)', lat: 53.921809, lng: 27.594482, num: 18, color: '#fd79a8' },
                { name: 'ЭФ (корпус 2)', lat: 53.922392, lng: 27.591964, num: 2, color: '#00cec9' },
                { name: 'МСФ (корпус 6)', lat: 53.923234, lng: 27.593750, num: 6, color: '#a29bfe' },
                { name: 'Фитр (корпус 11а)', lat: 53.923542, lng: 27.594567, num: 11, color: '#e17055' },
                { name: 'Спортивный комплекс (11б)', lat: 53.923015, lng: 27.595005, num: '11Б', color: '#e17055' },
            ];
            
            buildings.forEach(b => {
                const icon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="
                        background: ${b.color};
                        color: white;
                        width: 28px;
                        height: 28px;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 12px;
                        font-weight: 700;
                        border: 2px solid white;
                        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                        cursor: pointer;
                    ">${b.num}</div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });
                const marker = L.marker([b.lat, b.lng], { icon }).addTo(map);
                marker.bindPopup(`<b>${b.name}</b><br><span style="color:#636e72;">Корпус ${b.num}</span>`);
            });
            
            // ===== СТОЛОВАЯ =====
            const foodIcon = L.divIcon({
                className: 'food-marker',
                html: '🍴',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });
            const foodMarker = L.marker([53.922961, 27.591338], { icon: foodIcon }).addTo(map);
            foodMarker.bindPopup(`<b>🍴 Лучшая столовая</b><br><span style="color:#636e72;"></span>`);
            
            // ===== ГЕОЛОКАЦИЯ (КРАСНАЯ МЕТКА) =====
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;
                        
                        // Проверяем, в пределах ли карты пользователь
                        if (userLat > 53.918071 && userLat < 53.926573 && 
                            userLng > 27.588059 && userLng < 27.597969) {
                            
                            const userIcon = L.icon({
                                iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                                iconSize: [25, 41],
                                iconAnchor: [12, 41],
                                popupAnchor: [1, -34]
                            });
                            
                            L.marker([userLat, userLng], { icon: userIcon })
                                .addTo(map)
                                .bindPopup('📍 Вы здесь!');
                            
                            map.setView([userLat, userLng], 17);
                        }
                    },
                    function(error) {
                        console.log('❌ Геолокация не доступна');
                    },
                    { enableHighAccuracy: true }
                );
            }
            
            mapInitialized = true;
        }

        // ================================================================
        // 17. КАРТА (открытие/закрытие)
        // ================================================================
        function openMap() {
            document.getElementById('mapOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
            mapInitialized = false;
            setTimeout(initMap, 300);
        }

        function closeMap() {
            document.getElementById('mapOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ================================================================
        // 18. СПИСОК ГРУППЫ
        // ================================================================
        function openGroupList() {
            const tbody = document.getElementById('groupListBody');
            tbody.innerHTML = '';
            groupMembers.forEach((member, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${member.name}</td>
                    <td><span class="subgroup-tag">${member.subgroup}</span></td>
                    <td>${member.note || '—'}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('groupListOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeGroupList(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('groupListOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ================================================================
        // 19. ЭКЗАМЕНЫ
        // ================================================================
        function openExams() {
            const tbody = document.getElementById('examsBody');
            tbody.innerHTML = '';
            examsData.forEach(exam => {
                const tr = document.createElement('tr');
                let statusClass = 'exam-status';
                if (exam.status === 'Экзамен') statusClass += ' pass';
                else if (exam.status === 'Зачёт') statusClass += ' scheduled';
                tr.innerHTML = `
                    <td><strong>${exam.subject}</strong></td>
                    <td><span class="${statusClass}">${exam.status}</span></td>
                    <td>${exam.date}</td>
                    <td>${exam.note || '—'}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('examsOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeExams(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('examsOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ================================================================
        // 20. ЗАКРЫТИЕ МОДАЛОК ПО ESC
        // ================================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeMap();
                closeGroupList();
                closeExams();
            }
        });

        // ================================================================
        // 21. АВТОРАСШИРЕНИЕ ЗАМЕТОК
        // ================================================================
        document.addEventListener('input', function(e) {
            if (e.target.classList.contains('note-input')) {
                e.target.style.height = 'auto';
                e.target.style.height = e.target.scrollHeight + 'px';
            }
        });

        // ================================================================
        // 22. ЗАПУСК
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.querySelector(`.week-switch button[data-week="${realWeek}"]`);
            if (btn) btn.classList.add('active');
            
            render();
            updateTimerAndHighlight();
            
            setInterval(updateTimerAndHighlight, 1000);
        });

        console.log('✅ Страница загружена');
        console.log(`📅 Реальная неделя: ${realWeek}, реальный день: ${dayNames[realDayIndex]}`);
    </script>

</body>
</html>
